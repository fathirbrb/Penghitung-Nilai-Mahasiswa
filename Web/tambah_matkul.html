{% extends "base.html" %}
{% block title %}Tambah Mata Kuliah{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Tambah Mata Kuliah</h5>
    <form method="post">
      <div class="mb-3">
        <label for="nama" class="form-label">Nama Mata Kuliah</label>
        <input type="text" class="form-control" id="nama" name="nama" required>
      </div>
      <div class="mb-3">
        <label for="sks" class="form-label">SKS</label>
        <input type="number" class="form-control" id="sks" name="sks" required>
      </div>
      <button class="btn btn-primary">Simpan</button>
    </form>
    <hr>
    <p>Catatan: Setelah menambah mata kuliah, pastikan ada entri di tabel <code>penilaian_mata_kuliah</code> untuk mengatur persentase komponen (quiz, tugas, uts, uas, absensi, responsi).</p>
  </div>
</div>
{% endblock %}
