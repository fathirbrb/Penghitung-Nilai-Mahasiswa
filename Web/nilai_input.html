{% extends "base.html" %}

{% block title %}Input Nilai Mahasiswa{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Input Nilai Mahasiswa</h5>
    <form method="post">
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">Mahasiswa</label>
          <select name="id_mahasiswa" class="form-select" required>
            <option value="">-- Pilih Mahasiswa --</option>
            {% for m in mahasiswa %}
              <option value="{{ m.npm }}">{{ m.nama }} ({{ m.npm }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="col">
          <label class="form-label">Mata Kuliah</label>
          <select name="id_matkul" class="form-select" required>
            <option value="">-- Pilih Mata Kuliah --</option>
            {% for k in matkul %}
              <option value="{{ k.id_matkul }}">{{ k.nama_matkul }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Jumlah Tugas</label>
          <input type="number" class="form-control" name="jumlah_tugas" min="1" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Jumlah Quiz</label>
          <input type="number" class="form-control" name="jumlah_quiz" min="1" required>
        </div>
      </div>

      <button class="btn btn-primary">Simpan dan Lanjutkan</button>
    </form>
  </div>
</div>
{% endblock %}
