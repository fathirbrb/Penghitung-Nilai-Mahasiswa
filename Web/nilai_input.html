{% extends "base.html" %}
{% block title %}Input Nilai{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Input Nilai Mahasiswa</h5>

    <form method="post">
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">Mahasiswa</label>
          <select name="id_mahasiswa" class="form-select" required>
            <option value="">-- Pilih Mahasiswa --</option>
            {% for m in mahasiswa %}
              <option value="{{ m.id_mahasiswa }}">{{ m.nama }} ({{ m.nim }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col">
          <label class="form-label">Mata Kuliah</label>
          <select name="id_matkul" class="form-select" required>
            <option value="">-- Pilih Mata Kuliah --</option>
            {% for k in matkul %}
              <option value="{{ k.id_matkul }}">{{ k.nama_matkul }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <h6>Komponen Nilai</h6>
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label">Quiz 1</label>
          <input type="number" step="0.01" min="0" max="100" name="quiz1" class="form-control" value="0">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Quiz 2</label>
          <input type="number" step="0.01" min="0" max="100" name="quiz2" class="form-control" value="0">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Tugas 1</label>
          <input type="number" step="0.01" min="0" max="100" name="tugas1" class="form-control" value="0">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Tugas 2</label>
          <input type="number" step="0.01" min="0" max="100" name="tugas2" class="form-control" value="0">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Tugas 3</label>
          <input type="number" step="0.01" min="0" max="100" name="tugas3" class="form-control" value="0">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Tugas 4</label>
          <input type="number" step="0.01" min="0" max="100" name="tugas4" class="form-control" value="0">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">UTS</label>
          <input type="number" step="0.01" min="0" max="100" name="uts" class="form-control" value="0">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">UAS</label>
          <input type="number" step="0.01" min="0" max="100" name="uas" class="form-control" value="0">
        </div>
      </div>

      <h6>Absensi</h6>
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Pertemuan (total)</label>
          <input type="number" name="pertemuan" class="form-control" min="0" value="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Kehadiran</label>
          <input type="number" name="hadir" class="form-control" min="0" value="0">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Responsi (jika ada)</label>
        <input type="number" step="0.01" min="0" max="100" name="responsi" class="form-control" value="0">
      </div>

      <button class="btn btn-success">Simpan Nilai</button>
    </form>
  </div>
</div>
{% endblock %}
